workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: __IMAGE_URI__
      args:
        - --config=configs/default.yaml
        - --skip-gate
      env:
        - name: GCS_DATA_DIR
          value: __GCS_DATA_DIR__
        - name: GCS_BUCKET
          value: __GCS_BUCKET__
