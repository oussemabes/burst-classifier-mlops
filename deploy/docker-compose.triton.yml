# Local development stack — no Triton, ONNX Runtime runs inside the API container
# Usage:
#   python -m burst_classifier.train --config configs/default.yaml  # produces artifacts/latest/model.onnx
#   docker compose -f deploy/docker-compose.triton.yml up --build

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    environment:
      MODEL_PATH: /models/model.onnx   # local file mount, no GCS needed
      GCS_BUCKET: ""
    ports:
      - "8080:8080"
    volumes:
      - ../artifacts/latest:/models:ro

  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
