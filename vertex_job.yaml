workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: europe-west1-docker.pkg.dev/kwore-web-dev/burst-classifier/burst-classifier-train:03a0db8
      args:
        - --config=configs/default.yaml
        - --skip-gate
      env:
        - name: GCS_DATA_DIR
          value: gs://kwore-web-dev-burst-classifier/data
        - name: GCS_BUCKET
          value: kwore-web-dev-burst-classifier
